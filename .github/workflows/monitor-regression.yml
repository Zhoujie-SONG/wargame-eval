name: Monitor regression and frontend tests
on:
  push:
    branches: [main, perf-monitor-preflight-20261023]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests (no real model calls)
        run: python -m pytest -q
      - name: JavaScript syntax check
        if: always()
        run: node --check app/web/competition.js && node --check tests/frontend_batch_mode.test.cjs
      - name: Frontend tests
        if: always()
        run: node --test tests/frontend_batch_mode.test.cjs
      - name: Synthetic large-database monitoring benchmark
        if: always()
        run: python tests/perf_monitor.py
